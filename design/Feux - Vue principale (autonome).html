      ';</' + 'script>';

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

    <label for=\"q\" style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5A5478;margin-bottom:8px;\">// chercher un massif ou un département<\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:10px;background:#0D0B16;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:0 14px;height:52px;\">\n          <span style=\"font-family:'JetBrains Mono',monospace;color:#F5FF00;font-weight:700;\">$<\u002Fspan>\n          <input id=\"q\" type=\"search\" placeholder=\"Fontainebleau, Bavella, 13, Var…\" autocomplete=\"off\" style=\"flex:1;background:transparent;border:0;outline:none;color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:14px;height:100%;\">\n          <kbd style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#5A5478;border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:2px 6px;\">↵<\u002Fkbd>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6C6790;\">fréquent :<\u002Fspan>\n          <a href=\"#zone-fontainebleau\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;\">#fontainebleau<\u002Fa>\n          <a href=\"#zone-trois-pignons\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;\">#trois-pignons<\u002Fa>\n          <a href=\"#zone-illarata\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;\">#illarata<\u002Fa>\n          <a href=\"#zone-13\" style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;\">#bouches-du-rhône<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin:0 24px 22px;border-left:4px solid #C22C22;background:rgba(194,44,34,.12);border-radius:0 4px 4px 0;padding:14px 18px;\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#FF8A7E;margin-bottom:6px;\">avertissement permanent<\u002Fdiv>\n      <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#A6A1C0;font-weight:300;text-wrap:pretty;\">Ceci <strong style=\"color:#FF8A7E;font-weight:600;\">n'est pas une carte d'autorisation d'accès<\u002Fstrong>. Le niveau affiché est la Météo des forêts de Météo-France : un indicateur <strong style=\"color:#FF8A7E;font-weight:600;\">indicatif<\u002Fstrong>, à la maille du <strong style=\"color:#FF8A7E;font-weight:600;\">département<\u002Fstrong>. Seul <strong style=\"color:#FF8A7E;font-weight:600;\">l'arrêté préfectoral zonal<\u002Fstrong> autorise ou interdit l'accès à un massif.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"{{ gridStyle }}\">\n\n      <aside style=\"{{ asideStyle }}\">\n        <div style=\"background:#1C192B;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5A5478;margin-bottom:12px;\">// couverture du jour<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;\">\n            <div><div style=\"font-family:'Squada One',sans-serif;font-size:30px;color:#FFFFFF;line-height:1;\">96<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6C6790;margin-top:3px;\">départements météo<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'Squada One',sans-serif;font-size:30px;color:#E07B00;line-height:1;\">7<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6C6790;margin-top:3px;\">en niveau 3 ou 4<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'Squada One',sans-serif;font-size:30px;color:#FFFFFF;line-height:1;\">6<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6C6790;margin-top:3px;\">zones qualifiées<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'Squada One',sans-serif;font-size:30px;color:#FFFFFF;line-height:1;\">28<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#6C6790;margin-top:3px;\">trouvailles de veille<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;padding-top:11px;border-top:1px dashed rgba(255,255,255,.07);font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6C6790;line-height:1.55;\">◆ 3 massifs avec contour<br>◆ 2 massifs sans contour<br>◆ 10 départements veillés<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#1C192B;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5A5478;\">// fond départemental<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:300;color:#9B96B4;margin:7px 0 11px;line-height:1.45;\">Météo des forêts, indicatif, maille départementale. Le relief traduit le niveau.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:11px;border-radius:2px;background:#3D8B4A;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A6A1C0;\">1 · faible<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:14px;border-radius:2px;background:#E0B400;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A6A1C0;\">2 · modéré<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:18px;border-radius:2px;background:#E07B00;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A6A1C0;\">3 · élevé<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:22px;border-radius:2px;background:#C22C22;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A6A1C0;\">4 · très élevé<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:9px;border-radius:2px;background:#3A3F34;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6C6790;\">hors saison / non couvert<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:11px;padding:9px 10px;background:#0D0B16;border:1px dashed #5A5478;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6C6790;line-height:1.5;\">⌀ 84 départements restent plats : leur niveau n'est pas dans l'extrait de données du 26/07. Rien n'est deviné.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#1C192B;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5A5478;\">// couche opposable<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:300;color:#9B96B4;margin:7px 0 11px;line-height:1.45;\">Chaque statut porte une couleur, un libellé et une forme. La couleur seule ne dit jamais rien.<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;\">\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:16px;border-radius:2px;background:#C22C22;border:2px solid #F0605A;\"><\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A6A1C0;\">INTERDIT<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"position:relative;width:26px;height:16px;border-radius:2px;background:#E04A2F;border:2px solid #FF8A6E;display:flex;align-i } this.setState({hero:'fini'}); };\n      this._t = setTimeout(fin, 2700);\n      this._skip = ()=>{ if(this.state.hero!=='fini'){ clearTimeout(this._t); fin(); } };\n      ['wheel','pointerdown','keydown','touchstart'].forEach(e=>window.addEventListener(e,this._skip,{passive:true,once:false}));\n    }\n    if(!window.FEUX_GEO){\n      this._poll = setInterval(()=>{ if(window.FEUX_GEO){ clearInterval(this._poll); this.forceUpdate(); } }, 60);\n    }\n  }\n  componentWillUnmount(){\n    clearTimeout(this._t); clearInterval(this._poll);\n    if(this._skip) ['wheel','pointerdown','keydown','touchstart'].forEach(e=>window.removeEventListener(e,this._skip));\n  }\n\n  jour(){ return this.props.jour === 'J+2' ? 2 : this.state.jour; }\n  relief(){ return this.props.relief != null ? this.props.relief : 1; }\n  ky(){ return Math.cos(this.state.tilt*Math.PI/180); }\n\n  niveau(code){ const n = NIV[code]; return n ? n[this.jour()-1] : 0; }\n  hauteur(code){ return HBASE[this.niveau(code)] * this.relief(); }\n\n  skirt(pts, h){\n    if(!pts || h<2) return '';\n    const dy = -h/this.ky(); let d='';\n    pts.forEach(flat=>{\n      for(let i=0;i<flat.length-2;i+=2){\n        const x0=flat[i], y0=flat[i+1], x1=flat[i+2], y1=flat[i+3];\n        d += 'M'+x0+' '+y0+'L'+x1+' '+y1+'L'+x1+' '+(y1+dy).toFixed(1)+'L'+x0+' '+(y0+dy).toFixed(1)+'Z';\n      }\n    });\n    return d;\n  }\n\n  vb(){\n    const g = window.FEUX_GEO;\n    if(this.state.view) return this.state.view;\n    if(!g) return {x:0,y:0,w:1000,h:700};\n    return {x:-40, y:-60, w:1080, h:g.h*this.ky()+140};\n  }\n\n  setView(v){ this.setState({view:v}); }\n\n  renderVals(){\n    const g = window.FEUX_GEO;\n    const v = this.vb();\n    const ky = this.ky();\n    const s = this.state;\n    const sel = s.sel;\n    const W = s.w;\n    const cible = (code,w)=>{ const d=g&&g.deps.find(x=>x.c===code); if(!d) return null;\n      const h=w*.72, cy=d.y*ky - this.hauteur(code) - 12;\n      return {x:d.x-w/2, y:cy-h/2, w:w, h:h}; };\n    let vue77 = cible('77',180);\n    if(g && g.massifs.length){\n      const xs=g.massifs.map(m=>m.x), ys=g.massifs.map(m=>m.y*ky - this.hauteur('77') - 8);\n      const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2, cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;\n      const w=Math.max(46, (Math.max.apply(null,xs)-Math.min.apply(null,xs))+34);\n      vue77={x:cx-w/2, y:cy-w*.36, w:w, h:w*.72};\n    }\n    const zoomCibles = [\n      {k:'77', label:'Seine-et-Marne', view:vue77},\n      {k:'2A', label:'Corse-du-Sud', view:cible('2A',200)}\n    ];\n\n    const mapDeps = [], mapLabels = [], mapMassifs = [], mapMarkers = [];\n    const zoomFort = v.w < 420;\n    const mapPxW = W>1480 ? Math.max(320,W-880) : (W>1250 ? Math.max(320,W-742) : (W>900 ? Math.max(320,W-420) : Math.max(300,W-60)));\n    const k = v.w / mapPxW;\n    if(g){\n      const ordered = g.deps.slice().sort((a,b)=>a.y-b.y);\n      ordered.forEach(d=>{\n        const niv = this.niveau(d.c);\n        const h = this.hauteur(d.c);\n        const col = DCOL[niv];\n        const actif = sel===d.c;\n        const colA = zoomFort ? mix(col,'#0A0812',.5) : col;\n        mapDeps.push({\n          d:d.d, skirt:this.skirt(d.pts, h), side:mix(colA,'#07050E',.58),\n          tf:'translate(0,'+(-h/ky).toFixed(2)+')',\n          fill: colA,\n          stroke: actif ? '#9ED5E1' : (niv?'rgba(10,8,18,.55)':'rgba(255,255,255,.055)'),\n          sw: (actif ? 1.8 : .6)*k,\n          aria: d.n+' ('+d.c+') — '+(niv?('niveau '+niv+', '+LIB[niv]):'niveau non renseigné dans l\\u2019extrait'),\n          onSel: ()=>this.setState({sel:d.c})\n        });\n        if(niv && !zoomFort){\n          mapLabels.push({x:d.x, y:(d.y*ky - h + 4*k).toFixed(1), t:d.c, size:((niv>=3?13:11)*k).toFixed(2),\n            fill: niv===2||niv===3 ? '#0A0812' : '#FFFFFF'});\n        }\n      });\n      g.massifs.forEach(m=>{\n        const st = STAT[MASSIF_STAT[m.cle]];\n        const hb = this.hauteur(m.dep);\n        const lift = hb + 6*this.relief();\n        const inc = MASSIF_STAT[m.cle]==='incertain';\n        const actif = sel===m.cle;\n        mapMassifs.push({\n          d:m.d, skirt:'', side:'transparent',\n          tf:'translate(0,'+(-lift/ky).toFixed(2)+')',\n          fill: inc ? 'url(#hachIncertain)' : st.c,\n          stroke: actif ? '#9ED5E1' : st.b, sw: (actif?2:1.2)*k, dash: inc?(2.6*k).toFixed(2)+' '+(1.8*k).toFixed(2):'0',\n          aria: m.nom+' — '+st.lib,\n          cx:m.x, cy:(m.y*ky - lift - 7).toFixed(1),\n          chevron:'', glyph:0, glyphFill:'transparent',\n          onSel: ()=>this.setState({sel:m.cle})\n        });\n        if(!zoomFort){\n          const ym = m.y*ky - lift;\n          mapMarkers.push({x:m.x, y:ym, y2:(ym-30*k).toFixed(1), ty:(ym-25.6*k).toFixed(1), r:((actif?9:7.5)*k).toFixed(2),\n            color:st.b, sw:((actif?2.2:1.5)*k).toFixed(2), dash:'0', fs:((actif?13:11)*k).toFixed(2),\n            glyph: inc?'▨':'■', aria:m.nom+' — '+st.lib,\n            onSel:()=>this.setState({sel:m.cle})});\n        }\n      });\n      const d2A = g.deps.find(d=>d.c==='2A');\n      if(d2A){\n        const h2 = this.hauteur('2A');\n        const s2 = k;\n        [{k:'illarata',nom:'Illarata – Taglio Rosso',c:'#FF8A6E',dx:-9*s2*8,st:'INTERDIT — sans terme',ch:'▲'},\n         {k:'bavella',nom:'Massif de Bavella',c:'#6FA37E',dx:9*s2*8,st:'interdiction levée',ch:'⌀'}].forEach(mk=>{\n          const x=d2A.x+mk.dx, y=d2A.y*ky - h2;\n          const actif = sel===mk.k;\n          mapMarkers.push({x:x, y:y, y2:(y-34*s2).toFixed(1), ty:(y-29.4*s2).toFixed(1), r:((actif?10.5:9)*s2).toFixed(2),\n            color:mk.c, sw:((actif?2.2:1.6)*s2).toFixed(2), dash:(3.5*s2).toFixed(2)+' '+(2.5*s2).toFixed(2), fs:((actif?14:12)*s2).toFixed(2), glyph:mk.ch,\n            aria:mk.nom+' — '+mk.st+' · périmètre non numérisé',\n            onSel:()=>this.setState({sel:mk.k})});\n        });\n      }\n    }\n\n    const mkBtn = (on)=>'font-family:\\'JetBrains Mono\\',monospace;font-size:12px;font-weight:600;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;transition:background .12s;background:'+(on?'#221E36':'transparent')+';color:'+(on?'#FFFFFF':'#6C6790')+';';\n\n    const focus = s.focus;\n    const zoomLabel = focus<0 ? 'Zoomer sur les zones interdites' : (focus===0 ? 'Zone suivante : Corse-du-Sud ▸' : 'Zone suivante : Seine-et-Marne ▸');\n\n    const zones = ZONES.map(z=>{\n      const st = STAT[z.st];\n      const actif = sel===z.k;\n      const bg = z.st==='levee' ? '#161421' : '#1C192B';\n      return {\n        anchor:'zone-'+z.k, nom:z.nom, dep:z.dep, periode:z.periode, note:z.note,\n        arrete:z.arrete, source:z.src, lienLabel:z.lien, chips:z.chips,\n        derogations:z.derogations||[],\n        badge: z.badgeOverride ? z.badgeOverride : st.lib,\n        cardStyle:'background:'+bg+';border:1px solid '+(actif?'#9ED5E1':'rgba(255,255,255,.07)')+';border-left:3px solid '+st.c+';border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .15s;opacity:'+(z.st==='levee'?'.82':'1')+';',\n        badgeStyle:'flex:none;font-family:\\'JetBrains Mono\\',monospace;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:4px 7px;white-space:nowrap;'+(\n          z.st==='incertain' ? 'color:#FFD9A8;border:1px dotted #D98324;background:repeating-linear-gradient(45deg,rgba(180,83,9,.55) 0 4px,rgba(180,83,9,.18) 4px 8px);' :\n          z.st==='levee' ? 'color:#8FC7A0;border:1px solid #4A7C59;background:rgba(74,124,89,.12);' :\n          'color:#FFFFFF;border:1px solid '+st.b+';background:'+st.c+';'),\n        periodeStyle:'font-family:\\'JetBrains Mono\\',monospace;font-size:12px;color:'+(z.st==='levee'?'#8FC7A0':'#FFFFFF')+';margin-top:9px;line-height:1.45;',\n        noteStyle:'font-size:12.5px;font-weight:300;line-height:1.5;color:#9B96B4;margin-top:6px;text-wrap:pretty;',\n        contour: z.contour||'',\n        contourStyle: z.contour ? 'margin-top:9px;padding:8px 10px;background:#0D0B16;border:1px dashed #5A5478;border-radius:8px;font-family:\\'JetBrains Mono\\',monospace;font-size:11px;color:#6C6790;line-height:1.5;' : 'display:none;',\n        deroStyle: (z.derogations&&z.derogations.length) ? 'margin-top:9px;background:#0D0B16;border:1px solid rgba(255,255,255,.07);border-radius:8px;' : 'display:none;',\n        deroLabel: (z.derogations?z.derogations.length:0)+' dérogations · accès qui restent autorisés',\n        onSel: ()=>this.setState({sel:z.k})\n      };\n    });\n\n    let iT='◆ survolez ou tabulez la carte', iD='départements extrudés selon le niveau J+'+this.jour();\n    if(sel){\n      const z = ZONES.find(x=>x.k===sel);\n      if(z){ iT='◆ '+z.nom; iD=(z.badgeOverride||STAT[z.st].lib)+' · '+z.periode; }\n      else if(g){\n        const d = g.deps.find(x=>x.c===sel);\n        if(d){ const n=this.niveau(d.c);\n          iT='◆ '+d.n+' ('+d.c+')';\n          iD = n ? ('Météo des forêts J+'+this.jour()+' : niveau '+n+', '+LIB[n]+' · indicatif, ne vaut pas autorisation')\n                 : 'niveau du jour absent de l\\u2019extrait de données · rien n\\u2019est deviné';\n        }\n      }\n    }\n\n    const heroOn = s.hero==='joue';\n    const large = W>1480;\n    const cols = large ? '340px minmax(0,1fr) 440px' : (W>1250 ? '300px minmax(0,1fr) 380px' : (W>900 ? 'minmax(0,1fr) 360px' : 'minmax(0,1fr)'));\n    const gridStyle = 'display:grid;grid-template-columns:'+cols+';gap:'+(large?18:14)+'px;padding:0 '+(W>700?(large?32:24):14)+'px '+(large?32:24)+'px;align-items:start;';\n    const deux = W<=1250 && W>900;\n    const asideStyle = deux\n      ? 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;grid-column:1 / -1;grid-row:1;align-items:start;'\n      : 'display:flex;flex-direction:column;gap:12px;'+(W<=900?'order:2;':'');\n    const mapStyle = 'background:#0D0B16;border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;'+(deux?'grid-row:2;grid-column:1;':'');\n    const zonesStyle = 'display:flex;flex-direction:column;gap:12px;'+(deux?'grid-row:2;grid-column:2;':'')+(W<=900?'order:-1;':'');\n    const h1Size = W>1480 ? 76 : (W>1000 ? 64 : (W>620 ? 48 : 38));\n    const heroGrid = 'padding:'+(W>700?(W>1480?'32px 32px 24px':'26px 24px 20px'):'20px 14px 16px')+';display:grid;grid-template-columns:'+(W>1000?'minmax(0,1fr) '+(W>1480?520:420)+'px':'minmax(0,1fr)')+';gap:'+(W>1000?'32px':'20px')+';align-items:end;';\n    return {\n      gridStyle, asideStyle, zonesStyle, heroGrid, mapStyle,\n      h1Style:'font-family:\\'Squada One\\',sans-serif;font-size:'+h1Size+'px;line-height:.94;margin:0;color:#FFFFFF;text-wrap:balance;',\n      svgStyle: 'display:block;width:100%;height:'+(W>1480?680:(W>1250?560:(W>900?480:360)))+'px;touch-action:none;cursor:grab;',\n      rootRef: el=>{ if(el&&el!==this._root){ this._root=el; if(this._ro) this._ro.observe(el); } },\n      colStyle:'flex:1 1 260px;',\n      viewBox: v.x+' '+v.y+' '+v.w+' '+v.h,\n      tiltTf: 'scale(1,'+ky.toFixed(4)+')',\n      flatTf: 'translate(0,0)',\n      mapDeps, mapLabels, mapMassifs, mapMarkers, zones,\n      franceD: g ? g.deps.map(d=>d.d).join('') : '',\n      tilt: s.tilt,\n      j1Btn: mkBtn(this.jour()===1), j2Btn: mkBtn(this.jour()===2),\n      resetBtn:'font-family:\\'JetBrains Mono\\',monospace;font-size:12px;background:transparent;color:#9ED5E1;border:1px solid rgba(158,213,225,.3);border-radius:10px;padding:8px 12px;cursor:pointer;',\n      zoomLabel,\n      inspectTitre:iT, inspectDetail:iD,\n      setJ1: ()=>this.setState({jour:1}),\n      setJ2: ()=>this.setState({jour:2}),\n      resetVue: ()=>this.setState({view:null, focus:-1, sel:null}),\n      zoomInterdits: ()=>{ const n=(s.focus+1)%2; const c=zoomCibles[n]; this.setState({focus:n, view:c.view, sel:n===0?'fontainebleau':'illarata'}); },\n      onTilt: e=>this.setState({tilt:+e.target.value}),\n      onWheel: e=>{ e.preventDefault(); const f=e.deltaY>0?1.12:1/1.12;\n        const nx=v.x+v.w*(1-f)/2, ny=v.y+v.h*(1-f)/2;\n        this.setState({view:{x:nx,y:ny,w:v.w*f,h:v.h*f}}); },\n      onDown: e=>{ e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);\n        this._drag={px:e.clientX,py:e.clientY,v:v,rect:e.currentTarget.getBoundingClientRect()}; },\n      onMove: e=>{ if(!this._drag) return; const r=this._drag.rect;\n        const dx=(e.clientX-this._drag.px)*this._drag.v.w/r.width;\n        const dy=(e.clientY-this._drag.py)*this._drag.v.h/r.height;\n        this.setState({view:{x:this._drag.v.x-dx, y:this._drag.v.y-dy, w:this._drag.v.w, h:this._drag.v.h}}); },\n      onUp: ()=>{ this._drag=null; },\n      heroStyle: heroOn\n        ? 'position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 42%, #0f0d1c 0%, #0A0812 70%);display:flex;align-items:center;justify-content:center;z-index:3;animation:feuxVoile 2.7s cubic-bezier(.6,.02,.3,1) forwards;'\n        : 'display:none;',\n      heroInner: 'animation:feuxArrivee 2.7s cubic-bezier(.6,.02,.3,1) forwards;transform-origin:50% 34%;'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
